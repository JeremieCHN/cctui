name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then
            ext=".exe"
          fi
          out="cctui-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags='-s -w' -o "dist/${out}" .
          ( cd dist && sha256sum "${out}" > "${out}.sha256" )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cctui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Move the fixed tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            echo "${RELEASE_TAG} 已移动到 ${GITHUB_SHA}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "${RELEASE_TAG} 已创建指向 ${GITHUB_SHA}"
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          {
            echo "滚动构建，每次手动触发后覆盖更新。"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- 触发方式: ${GITHUB_EVENT_NAME}"
            echo "- 构建时间(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 运行记录: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md
          echo "RELEASE_TITLE=cctui latest (${short_sha})" >> "${GITHUB_ENV}"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
            echo "已更新 Release ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
            echo "已创建 Release ${RELEASE_TAG}"
          fi

      - name: Show release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json tagName,url,assets \
            --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
